<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jazda! Polish Streets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A 2.5D pixel-art street-skating racer through Warsaw, Rzeszów, Gdańsk and Wrocław.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: the game canvas fills the screen; menus are stickers pasted over the live street. */
:root{
  --ink:#17162a;          /* outlines, text */
  --ink2:#2b2946;
  --concrete:#e4dfd2;     /* panels */
  --concrete2:#cfc8b6;
  --red:#e2304a;          /* biało-czerwona */
  --tram:#f6c443;         /* tram yellow, highlights */
  --cyan:#59d8e6;         /* boost */
  --pink:#ff4fa0;         /* paint shot */
  --ok:#4fbf6a;
  --muted:#6d6a7d;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:1;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#0d0c1a;color:var(--concrete);overflow:hidden;font-family:var(--body);font-size:calc(16px * var(--ui));-webkit-tap-highlight-color:transparent}
body{overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:grid;place-items:center;background:#0d0c1a}
#game{width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;height:auto;max-height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
.cb-on .hazard{outline:2px dashed #fff}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--tram);outline-offset:2px}

/* ---------- screens ---------- */
#screens{position:fixed;inset:0;pointer-events:none;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px))}
.screen{position:absolute;inset:max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));pointer-events:auto;display:flex;flex-direction:column;gap:14px;overflow:auto;scrollbar-width:thin}
.screen[hidden]{display:none!important}
.dim{background:linear-gradient(90deg, rgba(13,12,26,.82) 0%, rgba(13,12,26,.55) 46%, rgba(13,12,26,0) 75%)}
.full{background:rgba(13,12,26,.86);backdrop-filter:blur(2px)}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2{font-family:var(--display);font-weight:700;font-size:calc(30px * var(--ui));margin:0;letter-spacing:.02em;color:#fff;text-shadow:3px 3px 0 var(--red)}
.back{background:none;border:2px solid var(--concrete);border-radius:999px;padding:6px 14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8em}
.back:hover{background:var(--concrete);color:var(--ink)}
.spacer{flex:1}

/* logo */
.logo{margin:14px 0 6px;transform:rotate(-3deg);transform-origin:left center;width:max-content;max-width:100%}
.logo .l1{font-family:var(--display);font-weight:700;font-size:calc(84px * var(--ui));line-height:.9;color:#fff;letter-spacing:.01em;text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--ink)}
.logo .l2{display:inline-block;margin-top:10px;background:var(--tram);color:var(--ink);font-weight:800;padding:2px 10px;font-size:calc(15px * var(--ui));letter-spacing:.14em;text-transform:uppercase;transform:rotate(2deg);box-shadow:3px 3px 0 var(--ink)}
.menu{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:6px}
.mbtn{display:flex;align-items:center;gap:10px;background:var(--concrete);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:8px 18px 8px 12px;font-weight:800;font-size:calc(18px * var(--ui));letter-spacing:.04em;text-transform:uppercase;box-shadow:4px 4px 0 var(--ink);transition:transform .08s, box-shadow .08s, background .08s;min-width:230px;text-align:left}
.mbtn small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted);margin-left:auto;font-size:.72em}
.mbtn:hover,.mbtn:focus-visible{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--ink);background:#fff}
.mbtn.go{background:var(--red);color:#fff;font-size:calc(24px * var(--ui));padding:10px 22px}
.mbtn.go small{color:#ffd6dc}
.mbtn .ic{width:22px;height:22px;flex:none;image-rendering:pixelated}
.prog{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;font-size:.9em}
.chip{background:rgba(23,22,42,.85);border:2px solid var(--ink2);padding:4px 10px;border-radius:999px;font-weight:700;letter-spacing:.03em}
.chip b{color:var(--tram)}
.note{color:#c9c4d8;font-size:.85em;max-width:56ch}

/* panels and cards */
.panel{background:var(--concrete);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);padding:14px 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr))}
.card{background:var(--concrete);color:var(--ink);border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .08s}
.card:hover:not(.locked),.card:focus-visible{transform:translate(-2px,-2px)}
.card.sel{outline:4px solid var(--tram);outline-offset:0}
.card.locked{filter:grayscale(.8);opacity:.75;cursor:not-allowed}
.card .pv{display:block;width:100%;aspect-ratio:20/9;image-rendering:pixelated;background:#222}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card h3{margin:0;font-family:var(--display);font-size:calc(22px * var(--ui))}
.card p{margin:0;font-size:.88em;line-height:1.3;color:#3d3a4f}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.78em;font-weight:700;color:var(--muted)}
.stars{color:#c08a10;letter-spacing:.1em}
.lock{font-weight:800;color:var(--red);font-size:.8em;text-transform:uppercase;letter-spacing:.06em}
.tag{display:inline-block;background:var(--ink);color:var(--concrete);font-size:.7em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
table.spec{border-collapse:collapse;font-size:.85em;margin-top:6px}
table.spec td{padding:2px 10px 2px 0}
table.spec td:first-child{color:var(--muted)}

/* character + customize */
.charwrap{display:grid;grid-template-columns:minmax(200px, 300px) 1fr;gap:18px;align-items:start}
.portrait{background:radial-gradient(circle at 50% 70%, #3a3560 0, #17162a 70%);border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;padding:10px;position:relative;overflow:hidden}
.portrait canvas{width:100%;max-width:216px;aspect-ratio:2/3;image-rendering:pixelated}
.portrait .nm{position:absolute;left:10px;top:8px;font-family:var(--display);font-size:calc(30px * var(--ui));color:#fff;text-shadow:3px 3px 0 var(--red)}
.arrows{display:flex;gap:8px;margin-top:10px}
.abtn{background:var(--concrete);color:var(--ink);border:3px solid var(--ink);border-radius:6px;font-weight:800;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}
.abtn:hover{background:#fff}
.abtn.primary{background:var(--red);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85em}
.tab[aria-selected="true"]{background:var(--ink);color:var(--concrete)}
.items{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:8px;margin-top:10px}
.item{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;text-align:left;font-weight:700;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:54px}
.item small{font-weight:600;color:var(--muted);font-size:.78em}
.item.on{background:var(--tram)}
.item.locked{background:#e8e4dc;color:#8a879a;cursor:not-allowed}
.swatch{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);border-radius:3px;vertical-align:-2px;margin-right:6px}

/* skills */
.skill{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.skill .ico{width:52px;height:52px;border:3px solid var(--ink);border-radius:8px;background:var(--ink);display:grid;place-items:center}
.skill .ico canvas{width:36px;height:36px;image-rendering:pixelated}
.pips{display:flex;gap:5px;margin:4px 0}
.pip{width:26px;height:10px;border:2px solid var(--ink);border-radius:3px;background:#fff}
.pip.on{background:var(--ok)}
.skill p{margin:0;font-size:.85em;color:#3d3a4f}

/* options */
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr))}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(23,22,42,.12);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row label{font-weight:700}
.row select,.row input[type=range]{font:inherit;accent-color:var(--red)}
.row select,.panel select{border:2px solid var(--ink);border-radius:5px;background:#fff;color:var(--ink);padding:2px 6px}
.panel h3{margin:0 0 6px;font-family:var(--display);font-size:calc(20px * var(--ui))}
.keyrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:4px 0}
kbd{background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:5px;padding:1px 7px;font-family:var(--body);font-weight:800;font-size:.8em;color:var(--ink);white-space:nowrap}
textarea{width:100%;min-height:90px;font:12px/1.3 ui-monospace,Menlo,monospace;border:2px solid var(--ink);border-radius:5px;padding:6px;box-sizing:border-box;color:var(--ink);background:#fff;user-select:text;-webkit-user-select:text}
.confirm{background:#ffe1e5;border:2px solid var(--red);border-radius:6px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* results */
.res{display:grid;grid-template-columns:minmax(180px, 260px) 1fr;gap:18px;align-items:start}
.place{font-family:var(--display);font-size:calc(64px * var(--ui));line-height:1;color:#fff;text-shadow:4px 4px 0 var(--red)}
.place small{font-size:.4em;color:var(--tram);text-shadow:none;display:block;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));gap:8px;margin:10px 0}
.stat{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px 10px}
.stat b{display:block;font-size:1.3em;font-variant-numeric:tabular-nums}
.stat span{font-size:.75em;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.unl{margin:6px 0 0;padding-left:18px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--display);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
#hud[hidden]{display:none}
.hwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;max-height:100vh}
.htop{position:absolute;top:2.5%;left:2.5%;right:2.5%;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hscore{font-size:calc(26px * var(--ui));line-height:1}
.hscore small{display:block;font-size:.45em;letter-spacing:.12em;opacity:.8}
.hcombo{font-family:var(--body);font-weight:800;font-size:calc(14px * var(--ui));color:var(--tram);margin-top:4px;max-width:44vw;line-height:1.2}
.hpos{text-align:right;font-size:calc(34px * var(--ui));line-height:1}
.hpos small{font-size:.45em}
.hpos .t{display:block;font-size:.42em;letter-spacing:.06em;opacity:.85}
.hmap{position:absolute;top:3.5%;left:30%;right:30%;height:8px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.8);border-radius:6px}
.hmap i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #111}
.hmap i.me{width:16px;height:16px;background:var(--tram);z-index:2}
.hmap .fin{position:absolute;right:-4px;top:-8px;font-size:12px}
.hbot{position:absolute;left:2.5%;right:2.5%;bottom:3%;display:flex;align-items:flex-end;gap:16px}
.hspeed{font-size:calc(30px * var(--ui));line-height:.9}
.hspeed small{font-size:.4em;letter-spacing:.1em}
.hboost{flex:0 1 220px}
.hboost label{font-size:calc(11px * var(--ui));letter-spacing:.14em}
.bar{height:12px;border:2px solid #fff;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#fff);transition:width .1s}
.bar.on i{background:linear-gradient(90deg,#fff,var(--cyan));animation:pulse .3s infinite alternate}
@keyframes pulse{to{filter:brightness(1.5)}}
.hshot{display:flex;align-items:center;gap:6px;font-size:calc(13px * var(--ui));opacity:.35}
.hshot.ready{opacity:1}
.hshot .ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--pink) var(--p,100%), rgba(0,0,0,.4) 0);display:grid;place-items:center;border:2px solid #fff}
.hshot .ring::after{content:"";width:12px;height:12px;border-radius:50%;background:#fff}
.hcollect{margin-left:auto;font-size:calc(13px * var(--ui));text-align:right}
#feed{position:absolute;left:50%;top:25%;transform:translateX(-50%);text-align:center;font-size:calc(18px * var(--ui));white-space:nowrap}
#feed .tr{animation:rise 1s forwards}
#big{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-size:calc(54px * var(--ui));color:#fff;text-shadow:4px 4px 0 var(--red),7px 7px 0 var(--ink)}
#big.pop{animation:popin .8s forwards}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
#pops{position:absolute;left:50%;top:32%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
#pops div{font-size:calc(20px * var(--ui));animation:rise 1.4s forwards}
#bal{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:160px;height:12px;border:2px solid #fff;border-radius:6px;background:linear-gradient(90deg,var(--red) 0 12%, rgba(0,0,0,.45) 12% 88%, var(--red) 88%)}
#bal i{position:absolute;top:-5px;width:6px;height:18px;background:var(--tram);border:2px solid #111;left:50%;transform:translateX(-50%)}
#subs{position:absolute;left:50%;top:10.5%;transform:translateX(-50%);font-family:var(--body);font-weight:700;font-size:calc(16px * var(--ui));background:rgba(13,12,26,.8);padding:4px 12px;border-radius:4px;text-shadow:none;white-space:nowrap}
#subs[hidden]{display:none}
#subs em{font-style:normal;color:#c9c4d8;font-weight:600}
.tbtns{display:none;position:absolute;right:2%;bottom:16%;gap:10px;flex-direction:column;align-items:flex-end;pointer-events:auto}
.touch .tbtns{display:flex}
.tb{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:rgba(23,22,42,.55);font-family:var(--display);font-size:13px;color:#fff}
.tb.boost{background:rgba(89,216,230,.4)}
.tb.fire{background:rgba(255,79,160,.45)}
.tpause{position:absolute;top:21%;right:2%;width:42px;height:42px;border-radius:8px;border:2px solid #fff;background:rgba(23,22,42,.6);color:#fff;font-weight:800;pointer-events:auto;display:none}
.touch .tpause{display:block}
.fps{position:fixed;left:6px;bottom:4px;font:11px ui-monospace,monospace;color:#9f9;opacity:.8;pointer-events:none}
#rotate{position:fixed;inset:0;display:none;background:rgba(13,12,26,.95);z-index:20;place-items:center;text-align:center;font-family:var(--display);font-size:24px;padding:24px}
@media (orientation:portrait) and (pointer:coarse){ body.playing #rotate{display:grid} .portrait-hint{display:block!important} }
.portrait-hint{display:none;background:var(--tram);color:var(--ink);font-weight:800;padding:6px 10px;border-radius:5px}
#toast{position:fixed;left:50%;bottom:max(16px, env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--concrete);color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:8px 14px;font-weight:700;box-shadow:4px 4px 0 var(--ink);z-index:30;max-width:calc(100vw - 32px)}
#toast[hidden]{display:none}

@media (max-width:760px){
  .charwrap,.res{grid-template-columns:1fr}
  .logo .l1{font-size:calc(40px * var(--ui))}
  .mbtn{min-width:190px;font-size:calc(15px * var(--ui));padding:6px 12px}
  .mbtn.go{font-size:calc(19px * var(--ui))}
  .dim{background:rgba(13,12,26,.72)}
  .hmap{left:34%;right:34%}
}
@media (max-height:460px){
  .logo .l1{font-size:calc(30px * var(--ui))}
  .logo .l2{font-size:calc(11px * var(--ui));margin-top:6px}
  .menu{gap:6px;display:grid;grid-template-columns:repeat(2, minmax(0, 210px));align-items:stretch}
  .menu .mbtn{min-width:0}
  .menu .mbtn.go{grid-column:1 / -1;max-width:430px}
  .prog{font-size:.8em}
  .mbtn{padding:4px 12px;font-size:calc(14px * var(--ui));box-shadow:3px 3px 0 var(--ink)}
  .head h2{font-size:calc(22px * var(--ui))}
  .tb{width:54px;height:54px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition:none!important} }
.reduced *{animation-duration:.01ms!important;transition:none!important}
</style>
</head><body>

<div id="app">
  <canvas id="game" width="400" height="225" aria-label="Jazda! game view"></canvas>
  <div id="hud" hidden>
    <div class="hwrap">
      <div class="htop">
        <div><div class="hscore"><small>WYNIK · SCORE</small><span id="hScore">0</span></div><div class="hcombo" id="hCombo"></div></div>
        <div class="hpos" id="hPosBox"><span id="hPos">4</span><small id="hOf">/4</small><span class="t" id="hTime">0:00.0</span></div>
      </div>
      <div class="hmap" id="hMap" aria-hidden="true"><span class="fin">🏁</span></div>
      <div id="feed"></div>
      <div id="pops"></div>
      <div id="big"></div>
      <div id="bal" hidden><i id="balI"></i></div>
      <div id="subs" hidden></div>
      <div class="hbot">
        <div class="hspeed"><span id="hSpeed">0</span><small> KM/H</small></div>
        <div class="hboost"><label>BOOST</label><div class="bar" id="hBoostBar"><i id="hBoost"></i></div></div>
        <div class="hshot" id="hShot"><div class="ring" id="hRing"></div><span id="hShotTxt">PAINT</span></div>
        <div class="hcollect" id="hCollect"></div>
      </div>
      <button class="tpause" id="tPause" type="button" aria-label="Pause">II</button>
      <div class="tbtns">
        <button class="tb fire" id="tFire" type="button">FIRE</button>
        <button class="tb" id="tGrab" type="button">GRAB</button>
        <button class="tb boost" id="tBoost" type="button">BOOST</button>
      </div>
    </div>
  </div>
  <div id="screens"></div>
  <div id="rotate">Turn your phone sideways to skate.</div>
  <div id="toast" hidden role="status"></div>
  <div class="fps" id="fps" hidden></div>
</div>

<script>
const SITE_MODE = true;
"use strict";
/* =====================================================================
   JAZDA! (Polish Streets) — a 2.5D street-skating racer
   Modules (in this order): CORE · SAVE · INPUT · ART · TRACK · SKATER ·
   GAME · RENDER · AUDIO · UI · MAIN
   ===================================================================== */

/* ---------------------------------------------------------------------
   CORE: constants, maths, seeded random
   --------------------------------------------------------------------- */
const VERSION = "1.0.0";
const SAVE_KEY = "polish-streets-save";
const SAVE_VERSION = 1;

const VIEW = { w: 400, h: 225 };            // internal pixel resolution (changed by quality)
const SEG = 200;                            // segment length (world units)
const ROAD = 1100;                          // half road width (world units)
const LANES = [-0.667, 0, 0.667];           // lane centres, -1..1 = road edges
const CAM_H = 1100;                          // camera height above the road
const GRAV = 6600;                          // gravity (units/s²)
const BASE_MAX = 4400;                      // base top speed (units/s): about 2 road-widths a second, like Vacuum Racer

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const easeIn = t => t * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

/** Mulberry32: small, fast, seeded RNG so every city builds the same track each time. */
function RNG(seed) {
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.int = (lo, hi) => Math.floor(r.range(lo, hi + 1));
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.chance = p => r() < p;
  return r;
}
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

/* Colours: hex <-> rgb, mixing (used for day/night palettes) */
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgb2hex = ([r, g, b]) => "#" + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
const mixHex = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex([lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]); };
const shade = (h, f) => { const A = hex2rgb(h); return rgb2hex(f >= 0 ? A.map(v => v + (255 - v) * f) : A.map(v => v * (1 + f))); };
const rgba = (h, a) => { const A = hex2rgb(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; };

/* Upgrades older saves to the current version, filling in anything new. */
function migrateSave(s) {
  if (!s || typeof s !== "object") throw new Error("not a save");
  const f = freshSave();
  if (!s.v) s.v = 0;
  if (s.v < 1) { s.collect = s.collect || f.collect; s.v = 1; }
  for (const k of Object.keys(f)) if (s[k] === undefined) s[k] = f[k];
  s.skills = { ...f.skills, ...s.skills }; s.sel = { ...f.sel, ...s.sel }; s.opt = { ...f.opt, ...s.opt };
  s.opt.keys = { ...f.opt.keys, ...s.opt.keys }; s.collect = { ...f.collect, ...s.collect };
  for (const c of CHAR_KEYS) s.outfits[c] = { ...f.outfits[c], ...(s.outfits[c] || {}) };
  if (!CHARS[s.sel.char]) s.sel.char = "stary"; if (!CITIES[s.sel.city]) s.sel.city = "warsaw"; if (!DIFFS[s.sel.diff]) s.sel.diff = "easy";
  return s;
}
let storageOK = true;
function loadSave() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return migrateSave(JSON.parse(raw)); }
  catch (e) { storageOK = false; }
  try { localStorage.setItem(SAVE_KEY + "-test", "1"); localStorage.removeItem(SAVE_KEY + "-test"); } catch (e) { storageOK = false; }
  return freshSave();
}

function save(now) {
  if (!now) { clearTimeout(saveTimer); saveTimer = setTimeout(() => save(true), 300); return; }

}

function importSave(text) {
  const j = JSON.parse(text);
  const s = j && j.game === "polish-streets" ? j.save : j;
  if (!s || typeof s !== "object" || !("xp" in s) || !("skills" in s)) throw new Error("This file isn't a Jazda! save.");
  S = migrateSave(s); save(true); return S;
}

/* Progress helpers */
const levelOf = xp => Math.floor(Math.sqrt(xp / 900)) + 1;           // level 2 at 900 XP, 3 at 3600, 4 at 8100…
const xpFor = lv => (lv - 1) * (lv - 1) * 900;
const totalStars = () => Object.values(S.stars).reduce((a, b) => a + b, 0);
const totalCollect = () => Object.values(S.collect).reduce((a, b) => a + b.filter(Boolean).length, 0);
function meets(need) {
  if (!need) return true;
  if (need.level && levelOf(S.xp) < need.level) return false;
  if (need.stars && totalStars() < need.stars) return false;
  if (need.wins && S.wins < need.wins) return false;
  if (need.collect && totalCollect() < need.collect) return false;
  return true;
}
function needText(need) {
  if (need.level) return `Reach level ${need.level}`;
  if (need.stars) return `Earn ${need.stars} stars`;
  if (need.wins) return `Win ${need.wins} race${need.wins > 1 ? "s" : ""}`;
  if (need.collect) return `Find ${need.collect} hidden items`;
  return "";
}

/* ---------------------------------------------------------------------
   INPUT: keyboard (remappable) + touch swipes and buttons
   --------------------------------------------------------------------- */
const Input = {
  down: {},            // action -> held
  pressed: {},         // action -> pressed this frame (edge)
  touch: false,
  listen: null,        // callback when remapping
  codeToActions(code) { const out = []; for (const [a, codes] of Object.entries(S.opt.keys)) if (codes.includes(code)) out.push(a); return out; },
  press(a) { if (!this.down[a]) this.pressed[a] = true; this.down[a] = true; },
  release(a) { this.down[a] = false; },
  tap(a) { this.pressed[a] = true; },
  consume(a) { const p = this.pressed[a]; this.pressed[a] = false; return p; },
  endFrame() { this.pressed = {}; }
};
addEventListener("keydown", e => {
  if (Input.listen) { e.preventDefault(); Input.listen(e.code); return; }
  const acts = Input.codeToActions(e.code);
  if (acts.length && Game.state === "play") e.preventDefault();
  if (e.repeat) return;
  acts.forEach(a => Input.press(a));
  if (acts.includes("pause")) UI.onPauseKey();
});
addEventListener("keyup", e => { Input.codeToActions(e.code).forEach(a => Input.release(a)); });
addEventListener("blur", () => { Input.down = {}; if (Game.state === "play") UI.pause(); });

/* Touch: swipes on the game area. Tap = shoot (if ready) or flip trick (in the air). */
const Touch = { id: null, x0: 0, y0: 0, t0: 0, done: false, holdDown: false };
function setupTouch(el) {
  const TH = 28;
  addEventListener("touchstart", () => { if (!Input.touch) { Input.touch = true; document.body.classList.add("touch"); } }, { passive: true, capture: true });
  el.addEventListener("touchstart", e => {
    if (Game.state !== "play") return;
    const t = e.changedTouches[0]; Object.assign(Touch, { id: t.identifier, x0: t.clientX, y0: t.clientY, t0: performance.now(), done: false, holdDown: false });
    e.preventDefault();
  }, { passive: false });
  el.addEventListener("touchmove", e => {
    if (Game.state !== "play") return;
    const t = [...e.changedTouches].find(t => t.identifier === Touch.id); if (!t) return;
    e.preventDefault();
    const dx = t.clientX - Touch.x0, dy = t.clientY - Touch.y0;
    if (Touch.done) return;
    if (Math.abs(dx) > TH && Math.abs(dx) > Math.abs(dy)) { Input.tap(dx < 0 ? "left" : "right"); Touch.done = true; }
    else if (dy < -TH) { Input.tap("jump"); Touch.done = true; }
    else if (dy > TH) { Input.press("manual"); Touch.holdDown = true; Touch.done = true; }
  }, { passive: false });

/* ---------------------------------------------------------------------
   AI: reads the road ahead and presses the same buttons you do
   --------------------------------------------------------------------- */
function makeBrain(r, diffKey, idx) {
  const d = DIFFS[diffKey], skill = d.ai, personal = [0.985, 1.0, 1.015, 1.0][idx] || 1;
  let think = 0, plan = null, shootCool = rnd(4, 8), trickCool = 0; const decided = new WeakSet();
  return (dt, G) => {
    const I = blankInput(), T = G.T, p = G.player, segI = Math.floor(r.z / SEG);
    // pace with light rubber-banding so races stay close
    if (!r.isPlayer) {
      const gap = (p.z - r.z) / SEG;
      r.maxSpeed = r.baseMax * d.aiPace * personal * (1 + clamp(gap / 180, -0.07, 0.09));
    } else r.maxSpeed = r.baseMax;
    if (r.state === "bail" || r.finished) return I;
    think -= dt;
    if (r.state === "grind") { if (r.bal > 0.25) I.balL = true; if (r.bal < -0.25) I.balR = true; if (Math.random() < dt * (1 - skill) * 0.25) I.balR = !I.balR; return I; }
    if (think <= 0) {
      think = lerp(0.35, 0.08, skill) + Math.random() * 0.1;
      const look = Math.round(lerp(12, 34, skill));
      const danger = [0, 0, 0], low = [Infinity, Infinity, Infinity], railAt = [Infinity, Infinity, Infinity];
      for (let k = 0; k < look; k++) {
        const seg = T.segs[segI + k]; if (!seg) break;
        for (const o of seg.obs) { if (o.ramp) continue; if (o.low) low[o.lane] = Math.min(low[o.lane], k); else danger[o.lane] += 1 / k; }
        for (const rl of seg.rails) if (segI + k - rl.s0 <= 1) railAt[rl.lane] = Math.min(railAt[rl.lane], k);
      }
      for (const tr of T.trams) { const k = (tr.z - r.z) / SEG; if (k > -14 && k < look + 6) danger[1] += 2; }
      for (const pd of T.peds) { const k = pd.seg - segI; if (k > 0 && k < look) { const ln = pd.x < -0.33 ? 0 : pd.x > 0.33 ? 2 : 1; danger[ln] += 1 / k; } }
      const here = r.lane;
      const score = l => danger[l] * 10 + (l !== here && railAt[l] < 13 ? 3 : railAt[l] >= 14 && railAt[l] < look ? -0.4 : 0) + (low[l] < 8 ? 0.6 : 0) + Math.abs(l - here) * 0.15;
      let best = here; for (const l of [0, 1, 2]) if (Math.abs(l - here) <= 1 && score(l) < score(best) - 0.05) best = l;
      if (Math.random() > (1 - skill) * 0.35) { if (best < here) I.left = true; else if (best > here) I.right = true; }
      plan = { low: segI + low[best], rail: segI + railAt[best], lane: best };
    }
    // jump low obstacles and onto rails at the right moment (checked every frame)
    const sps = Math.max(10, r.speed / SEG);
    if (r.onGround) for (let k = 1; k <= Math.ceil(sps * 0.4); k++) {
      const seg = T.segs[segI + k]; if (!seg) break;
      for (const o of seg.obs) if (o.low && !o.ramp && Math.abs(o.x - r.x) < o.w + 0.14 && !decided.has(o) && k <= sps * 0.27) { decided.add(o); if (Math.random() < 0.55 + skill * 0.45) I.jump = true; }
      for (const rl of seg.rails) if (segI + k === rl.s0 && Math.abs(rl.x - r.x) < 0.2 && !decided.has(rl)) {
        if (k <= sps * 0.13 + 3 && k >= sps * 0.13) { decided.add(rl); if (Math.random() < 0.5 + skill * 0.5) I.jump = true; }
        else if (k < sps * 0.13) { decided.add(rl); if (Math.random() < 0.4 + skill * 0.6) { if (r.lane === 0) I.right = true; else if (r.lane === 2) I.left = true; else if (Math.random() < 0.5) I.left = true; else I.right = true; } }
      }
    }
    // in the air: steer away from a low obstacle at the landing spot
    if (r.airborne && r.vy < 400 && Math.random() < skill) {
      const tLand = (r.vy + Math.sqrt(Math.max(0, r.vy * r.vy + 2 * GRAV * r.y))) / GRAV, kl = tLand * sps;
      const lowIn = l => { for (let k = Math.floor(kl - 3); k < kl + 12; k++) { const sg = T.segs[segI + k]; if (sg && sg.obs.some(o => o.lane === l && (o.low ? !o.ramp : true))) return true; } return false; };
      if (lowIn(r.lane)) { const opts = [r.lane - 1, r.lane + 1].filter(l => l >= 0 && l <= 2 && !lowIn(l)); if (opts.length) { if (opts[0] < r.lane) I.left = true; else I.right = true; } }
    }
    // style in the air
    trickCool -= dt;
    const railBelow = () => { for (let k = 0; k < 45; k++) { const sg = T.segs[segI + k]; if (sg && sg.rails.some(rl => Math.abs(rl.x - LANES[r.lane]) < 0.2)) return true; } return false; };
    if (r.airborne && r.vy > 1200 && trickCool <= 0 && Math.random() < skill && !railBelow()) { I.flip = true; I.dir = pick(["", "left", "right"]); trickCool = 1; }
    // boost
    if (r.boostMeter > 0.5 && Math.random() < dt * (0.3 + skill * 0.5)) I.boost = true;
    if (!r.isPlayer) r.boostMeter = clamp(r.boostMeter + dt * 0.03, 0, 1);
    // shooting: only from in front, always telegraphed
    if (!r.isPlayer && d.aiShoot > 0 && G.state === "play") {

      const ahead = (r.z - p.z) / SEG;
      if (r.aimT > 0) { r.aimT -= dt; if (r.aimT <= 0) { G.firePellets(r, 1); r.aimLane = null; } }

      if (r.aimT > 0) { I.left = I.right = false; }
    }
    return I;
  };
}

      case "shoot": this.noiseHit(t, 0.12, "bandpass", 2200, 0.3, F, 3); this.tone(520, t, 0.1, "sine", 0.08, 2000, 0, 0, F); break;
      case "boost": { const src = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(); src.buffer = this.noise; fl.type = "bandpass"; fl.Q.value = 2; fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(3000, t + 0.5); g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7); src.connect(fl); fl.connect(g); g.connect(F); src.start(t); src.stop(t + 0.72); } break;
      case "pad": this.tone(NOTE(76), t, 0.15, "sawtooth", 0.08, 5000, 0, 0, F); this.tone(NOTE(83), t + 0.06, 0.2, "sawtooth", 0.08, 5000, 0, 0, F); break;
      case "win": case "finish": { const notes = name === "win" ? [0, 4, 7, 12, 16, 19, 24] : [0, 4, 7, 12]; notes.forEach((n, i) => this.tone(NOTE(67 + n), t + i * 0.09, 0.4, "square", 0.07, 5000, 0, 0, F));
        const src = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(); src.buffer = this.noise; src.loop = true; fl.type = "bandpass"; fl.frequency.value = 1400; fl.Q.value = 0.6;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 3); lfo.frequency.value = 9; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain);
        src.connect(fl); fl.connect(g); g.connect(F); src.start(t); lfo.start(t); src.stop(t + 3.1); lfo.stop(t + 3.1); } break;
      case "ui": this.tone(NOTE(84), t, 0.05, "square", 0.04, 5000, 0, 0, F); break;
    }
  },
  /* continuous sounds follow the player */
  tick(G) {
    if (!this.ok) return; const p = G.player, c = this.ctx, t = c.currentTime;
    const live = G.state === "play" && p && !p.finished || G.state === "results";
    const sf = p ? clamp(p.speed / p.baseMax, 0, 1.5) : 0;
    const rollOn = live && p.state === "ride" ? 0.05 + sf * 0.16 : 0;
    this.roll.g.gain.setTargetAtTime(rollOn, t, 0.05); this.roll.fl.frequency.setTargetAtTime(220 + sf * 520, t, 0.1);
    this.grind.g.gain.setTargetAtTime(live && p.state === "grind" ? 0.22 : 0, t, 0.03);
  },
  /* voice: supplied file, else the device's Polish voice (if installed), always with subtitles */
  voice(charKey, line, text) {
    if (!S.opt.voice) return;
    const f = Assets.vo[charKey] && Assets.vo[charKey][line];
    if (f) { try { const a = new Audio(f); a.volume = S.opt.sfx; a.play().catch(() => {}); return; } catch (e) {} }
    try {
      if (!("speechSynthesis" in window)) return;
      const voices = speechSynthesis.getVoices(), v = voices.find(v => /^pl/i.test(v.lang));
      if (!v) return;
      const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = 1.1; u.pitch = CHARS[charKey].sex === "f" ? 1.25 : 0.9; u.volume = S.opt.sfx;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }
};

/* Optional assets (GitHub version): assets/manifest.json overrides generated art/music */
const Assets = { music: {}, vo: {}, chars: {}, bg: {} };
async function loadAssets() {
  if (!SITE_MODE) return;
  try {
    const r = await fetch("assets/manifest.json", { cache: "no-store" }); if (!r.ok) return;
    const m = await r.json(), base = "assets/";
    const canPlay = f => { const a = document.createElement("audio"); return /\.mp3$/i.test(f) ? a.canPlayType("audio/mpeg") : /\.ogg$/i.test(f) ? a.canPlayType("audio/ogg") : "maybe"; };
    for (const [k, v] of Object.entries(m.music || {})) { const list = Array.isArray(v) ? v : [v]; const f = list.find(canPlay); if (f) Assets.music[k] = base + f; }
    for (const [ch, lines] of Object.entries(m.vo || {})) { Assets.vo[ch] = {}; for (const [l, f] of Object.entries(lines)) Assets.vo[ch][l] = base + f; }
    const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    for (const [ch, o] of Object.entries(m.chars || {})) { Assets.chars[ch] = {}; for (const [kind, f] of Object.entries(o)) { try { Assets.chars[ch][kind] = await loadImg(base + f); } catch (e) {} } }
    for (const [city, o] of Object.entries(m.bg || {})) for (const [kind, f] of Object.entries(o)) { try { const img = await loadImg(base + f); const art = cityArt(city); if (kind === "far") { art.sky.far = img; art.sky.farN = img; } if (kind === "near") { art.sky.near = img; art.sky.nearN = img; } if (kind === "sky") art.skyImg = img; } catch (e) {} }
    skaterCache.clear();
  } catch (e) { /* no assets: generated versions stay */ }
}

  },

  /* ---------- options ---------- */
  options() {
    const o = S.opt;
    const sel = (id, val, opts) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    this.screen("options", `
      <div class="head"><button class="back" type="button">← Back</button><h2>Options</h2></div>
      <div class="opts">
        <div class="panel"><h3>Sound</h3>
          <div class="row"><label for="oMus">Music</label><input type="range" id="oMus" min="0" max="1" step="0.05" value="${o.music}"></div>
          <div class="row"><label for="oSfx">Sound effects</label><input type="range" id="oSfx" min="0" max="1" step="0.05" value="${o.sfx}"></div>
          <div class="row"><label for="oVoice">Voice lines</label>${sel("oVoice", o.voice, [[true, "On"], [false, "Off"]])}</div>
          <div class="row"><label for="oSubs">Subtitles</label>${sel("oSubs", o.subs, [[true, "On"], [false, "Off"]])}</div>
          ${Audio2.ok ? "" : `<p class="note" style="color:#3d3a4f">Sound starts after your first tap or key press.</p>`}
        </div>
        <div class="panel"><h3>Graphics</h3>
          <div class="row"><label for="oQ">Quality</label>${sel("oQ", o.quality, [["auto", "Auto (adapts)"], ["high", "High"], ["medium", "Medium"], ["low", "Low"]])}</div>
          <div class="row"><label for="oFps">Show frame rate</label>${sel("oFps", o.fps, [[false, "Off"], [true, "On"]])}</div>
        </div>
        <div class="panel"><h3>Accessibility</h3>
          <div class="row"><label for="oCb">Colourblind mode</label>${sel("oCb", o.colorblind, [["off", "Off"], ["deuter", "Red-green (deuteranopia)"], ["protan", "Red-green (protanopia)"], ["tritan", "Blue-yellow (tritanopia)"]])}</div>
          <div class="row"><label for="oText">Text size</label>${sel("oText", o.text, [["s", "Small"], ["m", "Medium"], ["l", "Large"]])}</div>
          <div class="row"><label for="oRed">Reduced motion</label>${sel("oRed", o.reduced, [[false, "Off"], [true, "On: no shake, blur or colour split"]])}</div>
        </div>
        <div class="panel"><h3>Controls</h3>
          ${Object.keys(ACTION_NAMES).map(a => `<div class="keyrow"><span>${ACTION_NAMES[a]}</span><span>${o.keys[a].map(c => `<kbd>${keyName(c)}</kbd>`).join(" ")}</span><button class="tab" type="button" data-remap="${a}">Change</button></div>`).join("")}
          <div class="arrows"><button class="abtn" id="kReset" type="button">Reset keys</button></div>
          <p class="note" id="kHint" style="color:#3d3a4f"></p>
        </div>
        <div class="panel"><h3>Save</h3>
          <p class="note" style="color:#3d3a4f">Progress saves automatically in this browser. Export it to keep a copy or move it to another device.</p>
          <div class="arrows"><button class="abtn" id="sExp" type="button">Export save</button><label class="abtn" for="sFile" style="cursor:pointer">Import file</label><input type="file" id="sFile" accept=".json,application/json" hidden></div>
          <div id="sBox"></div>
          <div class="arrows"><button class="abtn" id="sReset" type="button">Reset all progress</button></div>
        </div>
      </div>`, "full");
    const bind = (id, fn) => this.el(id).onchange = e => { fn(e.target.value); save(); applyOptions(); };
    this.el("oMus").oninput = e => { o.music = +e.target.value; Audio2.setVolumes(); save(); };
    this.el("oSfx").oninput = e => { o.sfx = +e.target.value; Audio2.setVolumes(); save(); };
    bind("oVoice", v => o.voice = v === "true"); bind("oSubs", v => o.subs = v === "true"); bind("oQ", v => o.quality = v); bind("oFps", v => o.fps = v === "true");
    bind("oCb", v => o.colorblind = v); bind("oText", v => o.text = v); bind("oRed", v => o.reduced = v === "true");
    $$("[data-remap]").forEach(b => b.onclick = () => {
      const a = b.dataset.remap; this.el("kHint").textContent = `Press a key for ${ACTION_NAMES[a]}… (Esc cancels)`; b.textContent = "Press a key";
      Input.listen = code => { Input.listen = null; if (code !== "Escape" || a === "pause") { for (const k of Object.keys(o.keys)) o.keys[k] = o.keys[k].filter(c => c !== code); o.keys[a] = [code]; save(); } this.options(); };
    });
    this.el("kReset").onclick = () => { o.keys = JSON.parse(JSON.stringify(DEFAULT_KEYS)); save(); this.options(); };
    this.el("sExp").onclick = () => {
      const txt = exportSave();
      this.el("sBox").innerHTML = `<textarea id="sTxt" readonly aria-label="Save data">${esc(txt)}</textarea><div class="arrows"><button class="abtn" id="sCopy" type="button">Copy</button>${SITE_MODE ? `<button class="abtn" id="sDl" type="button">Download .json</button>` : ""}</div>`;
      this.el("sCopy").onclick = () => { navigator.clipboard.writeText(txt).then(() => this.toast("Save copied."), () => { this.el("sTxt").select(); this.toast("Select all and copy the text."); }); };
      if (SITE_MODE) this.el("sDl").onclick = () => { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); a.download = "polish-streets-save.json"; document.body.appendChild(a); a.click(); a.remove(); this.toast("If no file appeared, use Copy instead."); } catch (e) { this.toast("Downloads are blocked here. Use Copy instead."); } };
    };
    this.el("sFile").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { importSave(t); applyOptions(); this.toast("Save imported."); this.options(); } catch (err) { this.toast(err.message.includes("Jazda") ? err.message : "That file couldn't be read. Your current save is unchanged.", 4); } }); };
    this.el("sReset").onclick = () => {
      this.el("sBox").innerHTML = `<div class="confirm"><b>Delete all progress, skills and unlocks?</b><button class="abtn primary" id="sYes" type="button">Delete</button><button class="abtn" id="sNo" type="button">Keep</button></div>`;
      this.el("sYes").onclick = () => { const keep = S.opt; S = freshSave(); S.opt = keep; save(true); this.toast("Progress reset."); this.options(); };
      this.el("sNo").onclick = () => this.el("sBox").innerHTML = "";
    };
  },

  credits() {
    this.screen("credits", `
      <div class="head"><button class="back" type="button">← Back</button><h2>Credits</h2></div>
      <div class="panel" style="max-width:620px">
        <h3>Jazda! Polish Streets</h3>
        <p>Game design and direction: <b>Dasz</b>.<br>Code, pixel art and music: generated in the browser by Claude for this project. Every sprite, building and song is drawn or played by code, with no image or audio files.</p>
        <p>Fonts: Pixelify Sans and Barlow Semi Condensed (SIL Open Font Licence), via Google Fonts.</p>
        <p>Shops, brands and adverts in the streets (Bociek 24/7, Pączuś, Kompot Babci) are invented for the game. Landmarks are drawn as simplified silhouettes in tribute to Warsaw, Rzeszów, Gdańsk and Wrocław.</p>
        <p class="note" style="color:#3d3a4f">Version ${VERSION} · save format ${SAVE_VERSION}</p>
      </div>`);
  },

  /* ---------- pause + results ---------- */
  onPauseKey() {
    if (Input.listen) return;
    if (Game.state === "play" || Game.state === "countdown") this.pause();
    else if (Game.state === "pause") { if (this.cur === "pause") this.resume(); else this.pauseMenu(); }
    else if (this.cur !== "main" && this.cur !== "results" && Game.state === "menu") this.backTo();
  },
  pause() { if (Game.state !== "play" && Game.state !== "countdown") return; this._resumeState = Game.state; Game.state = "pause"; this.pauseMenu(); },
  pauseMenu() {
    this.stack = ["pause"];
    this.screen("pause", `<div class="head"><h2>Pauza</h2></div><nav class="menu">
      <button class="mbtn go" type="button" id="pRes" autofocus>Resume</button><button class="mbtn" type="button" id="pRe">Restart</button>
      <button class="mbtn" type="button" data-go="options">Options</button><button class="mbtn" type="button" id="pQuit">Quit to menu</button></nav>`, "full");
    this.el("pRes").onclick = () => this.resume(); this.el("pRe").onclick = () => { this.el("screens").innerHTML = ""; this.cur = "play"; Game.restart(); };
    this.el("pQuit").onclick = () => this.quit();
  },
  resume() { this.el("screens").innerHTML = ""; this.cur = "play"; Game.state = this._resumeState || "play"; Input.down = {}; },
  quit() { document.body.classList.remove("playing"); Game.state = "menu"; Game.T = null; this.main(); },
  results(r) {
    document.body.classList.remove("playing");
    const st = r.stats, race = r.mode === "race";
    const placeTxt = race ? ["", "1st", "2nd", "3rd", "4th"][r.place] : "Time!";
    const plTxt = race ? ["", "1. miejsce", "2. miejsce", "3. miejsce", "4. miejsce"][r.place] : "Koniec czasu";
    this.screen("results", `
      <div class="res">
        <div><div class="portrait"><canvas id="pv" width="48" height="72"></canvas></div></div>
        <div class="panel">
          <div class="place">${placeTxt}<small>${plTxt} · ${esc(CITIES[Game.city].en)} · ${DIFFS[Game.diff].name}</small></div>
          <div class="stats">
            <div class="stat"><b>${r.score.toLocaleString("en")}</b><span>Score${r.newBest ? " · new best" : ""}</span></div>
            <div class="stat"><b>${fmtTime(r.time)}</b><span>Time</span></div>
            <div class="stat"><b class="stars">${"★".repeat(r.stars)}${"☆".repeat(3 - r.stars)}</b><span>Stars${r.newStars ? ` · +${r.newStars} new` : ""}</span></div>
            <div class="stat"><b>+${r.xp}</b><span>XP · level ${r.lvAfter}${r.lvAfter > r.lvBefore ? " ↑" : ""}</span></div>
            <div class="stat"><b>+${r.sp}</b><span>Skill points</span></div>
            <div class="stat"><b>${st.tricks}</b><span>Tricks</span></div>
            <div class="stat"><b>${Math.round(st.bestCombo).toLocaleString("en")}</b><span>Best combo</span></div>
            <div class="stat"><b>${st.stars}</b><span>Gold stars</span></div>
            <div class="stat"><b>${st.hits}</b><span>Paint hits</span></div>
            <div class="stat"><b>${st.crashes}</b><span>Crashes</span></div>
          </div>
          ${r.collected.length ? `<p><b>Found:</b> ${r.collected.length} × ${esc(CITIES[Game.city].collectName)} (${S.collect[Game.city].filter(Boolean).length}/5 in ${esc(CITIES[Game.city].en)})</p>` : ""}
          ${r.unlocks.length ? `<p style="margin:6px 0 0"><b>Unlocked:</b></p><ul class="unl">${r.unlocks.map(u => `<li>${esc(u)}</li>`).join("")}</ul>` : ""}
          <div class="arrows" style="flex-wrap:wrap"><button class="mbtn go" id="rAgain" type="button" autofocus>Race again</button>${r.sp ? `<button class="mbtn" type="button" data-go="skills">Spend points</button>` : ""}<button class="mbtn" id="rMenu" type="button">Menu</button></div>
        </div>
      </div>`, "full");
    this.portraitLoop("pv", Game.player.look, race && r.place > 1 ? "idle" : Game.player.look.pose);
    this.el("rAgain").onclick = () => { this.el("screens").innerHTML = ""; this.cur = "play"; document.body.classList.add("playing"); Game.restart(); };
    this.el("rMenu").onclick = () => this.quit();
    this.showHUD(false);
  },

  /* ---------- HUD ---------- */
  showHUD(on) { this.hudOn = on; this.el("hud").hidden = !on; if (on) { this.el("feed").innerHTML = ""; this.el("pops").innerHTML = ""; this.el("big").textContent = ""; this.buildMap(); } },
  buildMap() {
    const m = this.el("hMap"); m.querySelectorAll("i").forEach(i => i.remove());
    const cols = { stary: "#f4f4f4", stara: "#efe0b6", kuba: "#59d8e6", ola: "#ff9ac0" };
    Game.all.forEach(s => { const i = document.createElement("i"); i.className = s.isPlayer ? "me" : ""; if (!s.isPlayer) i.style.background = cols[s.char]; i.title = CHARS[s.char].name; m.appendChild(i); s.dot = i; });
    m.hidden = Game.mode !== "race"; this.el("hPosBox").style.visibility = "visible";
  },
  tick(dt) {
    if (!this.hudOn || !Game.player) return;
    const p = Game.player, G = Game, c = this.hudCache;
    const set = (id, v) => { if (c[id] !== v) { c[id] = v; this.el(id).textContent = v; } };
    set("hScore", Math.round(p.score).toLocaleString("en"));
    const combo = p.combo.pts > 0 ? `${p.combo.names.slice(-4).join(" + ")}  ${Math.round(p.combo.pts)} × ${Math.max(1, p.combo.mult)}` : "";
    set("hCombo", combo);
    if (G.mode === "race") { set("hPos", String(p.place)); set("hOf", "/4"); set("hTime", fmtTime(G.time)); }
    else { set("hPos", String(Math.max(0, Math.ceil(90 - G.time)))); set("hOf", "s"); set("hTime", "SCORE RUN"); }
    set("hSpeed", String(Math.round(p.speed / BASE_MAX * 24)));
    const bw = Math.round(p.boostMeter * 100) + "%"; if (c.bw !== bw) { c.bw = bw; this.el("hBoost").style.width = bw; }
    this.el("hBoostBar").classList.toggle("on", p.boosting);
    const has = p.charges > 0 || p.shotLevel > 0; const sh = this.el("hShot");
    sh.style.display = has ? "flex" : "none";
    if (has) { sh.classList.toggle("ready", p.canShoot()); const pct = p.cool > 0 ? (1 - p.cool / (p.charges > 0 ? 0.8 : p.coolMax)) * 100 : 100; this.el("hRing").style.setProperty("--p", pct + "%"); set("hShotTxt", p.charges > 0 ? `PAINT ×${p.charges}` : "PAINT"); }
    const cName = CITIES[G.city]; set("hCollect", G.mode === "race" ? `${cName.collectPl}: ${S.collect[G.city].filter(Boolean).length}/5` : "");
    const bal = this.el("bal"); const showBal = p.state === "grind" || p.manual; if (bal.hidden === showBal) bal.hidden = !showBal;
    if (showBal) this.el("balI").style.left = (50 + clamp(p.bal, -1, 1) * 42) + "%";
    if (G.mode === "race" && G.T) for (const s of G.all) if (s.dot) s.dot.style.left = clamp(s.z / (G.T.finish * SEG), 0, 1) * 100 + "%";
  },
  trick(name, pts) { const f = this.el("feed"); const d = document.createElement("div"); d.className = "tr"; d.textContent = `${name} +${pts}`; f.innerHTML = ""; f.appendChild(d); },
  bank(gained, mult) { this.popup(`+${gained.toLocaleString("en")}${mult > 1 ? `  (×${mult})` : ""}`, "#ffe27a"); },
  popup(txt, col = "#fff", t = 1.4) { const box = this.el("pops"); const d = document.createElement("div"); d.textContent = txt; d.style.color = col; d.style.animationDuration = t + "s"; box.appendChild(d); setTimeout(() => d.remove(), t * 1000); while (box.children.length > 3) box.firstChild.remove(); },
  count(txt) { const b = this.el("big"); b.textContent = txt; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); },
  say(s, line, t = 1.6) {
    const text = CHARS[s.char].lines[line]; if (!text) return;
    Audio2.voice(s.char, line, text);
    if (!S.opt.subs) return;
    const e = this.el("subs"); e.innerHTML = `${esc(CHARS[s.char].name)}: „${esc(text)}” <em>${esc(LINE_EN[text] || "")}</em>`; e.hidden = false;
    clearTimeout(this._st); this._st = setTimeout(() => e.hidden = true, t * 1000);
  }
};
const fmtTime = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
function keyName(code) { return code.replace(/^Key/, "").replace(/^Digit/, "").replace("ArrowLeft", "←").replace("ArrowRight", "→").replace("ArrowUp", "↑").replace("ArrowDown", "↓").replace("ShiftLeft", "Shift").replace("ShiftRight", "R-Shift").replace("Escape", "Esc").replace("Space", "Space"); }
function skillIcon(cv, k) {
  const x = cv.getContext("2d"); x.imageSmoothingEnabled = false; x.clearRect(0, 0, 12, 12);
  const c = { shot: "#ff4fa0", jump: "#f6c443", grind: "#d8dce4", boost: "#59d8e6", skin: "#4fbf6a" }[k];
  if (k === "shot") { ellipse(x, 6, 6, 4, 4, c); P(x, 10, 2, c); P(x, 1, 10, c); P(x, 11, 9, c); }
  if (k === "jump") { R(x, 5, 2, 2, 8, c); R(x, 3, 4, 6, 2, c); R(x, 2, 10, 8, 2, "#fff"); }
  if (k === "grind") { R(x, 0, 6, 12, 2, c); R(x, 2, 8, 1, 4, c); R(x, 9, 8, 1, 4, c); P(x, 6, 4, "#ffd36b"); P(x, 8, 3, "#ffd36b"); }
  if (k === "boost") { R(x, 1, 5, 7, 3, c); R(x, 8, 4, 2, 5, c); P(x, 10, 6, c); R(x, 0, 2, 4, 1, "#fff"); R(x, 0, 10, 4, 1, "#fff"); }
  if (k === "skin") { R(x, 2, 1, 8, 7, c); R(x, 3, 8, 6, 2, c); R(x, 5, 10, 2, 1, c); R(x, 5, 3, 2, 4, "#fff"); }
}
function applyOptions() {
  const o = S.opt;
  document.documentElement.style.setProperty("--ui", { s: 0.9, m: 1, l: 1.22 }[o.text] || 1);
  document.body.classList.toggle("reduced", !!o.reduced);
  document.body.classList.toggle("cb-on", o.colorblind !== "off");
  UI.el("fps").hidden = !o.fps;
  if (o.quality !== "auto" && Render.qName !== o.quality) Render.setQuality(o.quality);
  Audio2.setVolumes();
}
/* touch buttons */
function setupTouchButtons() {
  const hold = (id, act) => { const b = UI.el(id); b.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); Input.press(act); }, { passive: false }); b.addEventListener("touchend", e => { e.preventDefault(); Input.release(act); }); };
  hold("tGrab", "grab");
  const tap = (id, act) => UI.el(id).addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); Input.tap(act); }, { passive: false });
  tap("tBoost", "boost"); tap("tFire", "fire");
  UI.el("tPause").addEventListener("click", () => UI.pause());
  UI.el("tPause").addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); UI.pause(); }, { passive: false });
}
/* menu keyboard navigation: arrows move focus between buttons */
addEventListener("keydown", e => {
  if (Game.state === "play" || Game.state === "countdown" || Input.listen) return;
  if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) { if (e.code === "Space" && UI.cur === "ready" && document.activeElement && document.activeElement.tagName !== "BUTTON" && document.activeElement.tagName !== "SELECT") UI.go(); return; }
  if (document.activeElement && (document.activeElement.tagName === "SELECT" || document.activeElement.type === "range")) return;
  const f = $$("#screens button:not([disabled]), #screens select, #screens input[type=range]"); if (!f.length) return;
  const i = f.indexOf(document.activeElement), d = (e.code === "ArrowDown" || e.code === "ArrowRight") ? 1 : -1;
  e.preventDefault(); f[(i + d + f.length) % f.length].focus();
});

/* ---------------------------------------------------------------------
   MAIN: boot, game loop, adaptive quality
   --------------------------------------------------------------------- */
const Perf = { avg: 16.7, lowT: 0, highT: 0, fpsT: 0, frames: 0 };
function adapt(dtMs) {
  Perf.avg = lerp(Perf.avg, dtMs, 0.05);
  Perf.frames++; Perf.fpsT += dtMs;
  if (Perf.fpsT > 500) { if (S.opt.fps) UI.el("fps").textContent = `${Math.round(Perf.frames * 1000 / Perf.fpsT)} fps · ${Render.qName}`; Perf.frames = 0; Perf.fpsT = 0; }
  if (S.opt.quality !== "auto") return;
  if (Perf.avg > 21) { Perf.lowT += dtMs; Perf.highT = 0; } else if (Perf.avg < 14) { Perf.highT += dtMs; Perf.lowT = 0; } else { Perf.lowT = Perf.highT = 0; }
  const order = ["low", "medium", "high"], i = order.indexOf(Render.qName);
  if (Perf.lowT > 2000 && i > 0) { Render.setQuality(order[i - 1]); Perf.lowT = 0; Perf.avg = 16.7; }
  if (Perf.highT > 6000 && i < 2) { Render.setQuality(order[i + 1]); Perf.highT = 0; Perf.avg = 16.7; }
}
let lastT = performance.now();
function loop(now) {
  const dtMs = Math.min(100, now - lastT); lastT = now;
  const dt = Math.min(0.05, dtMs / 1000);
  try {
    Game.update(dt);
    Render.frame(dt);
    UI.tick(dt);
    Audio2.tick(Game);
  } catch (e) { console.error(e); }
  Input.endFrame();
  if (document.visibilityState === "visible") adapt(dtMs);
  requestAnimationFrame(loop);
}
function boot() {
  makeProps();
  applyOptions();
  Render.init(document.getElementById("game"));
  setupTouch(document.getElementById("app"));
  setupTouchButtons();
  const unlockAudio = () => { Audio2.init(); if (Game.state === "menu") Audio2.music("menu"); };
  addEventListener("pointerdown", unlockAudio, { once: false });
  addEventListener("keydown", unlockAudio, { once: false });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && Game.state === "play") UI.pause(); });
  if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {} }
  UI.main();
  if (!storageOK) UI.toast("Storage is blocked, so progress won't be saved.", 4);
  loadAssets();
  requestAnimationFrame(loop);
}
boot();

</script>
